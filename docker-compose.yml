version: "3.9"

# ─────────────────────────────────────────────
#  xShield Production Infrastructure
#
#  VPS dizin yapısı:
#    ~/xshield/web/      ← utonguc/xshield      (xshield.com.tr)
#    ~/xshield/eclinic/  ← utonguc/eclinic       (e-Clinic ürünü)
#    ~/xshield/signed/   ← utonguc/signed        (Signed ürünü)
#    ~/xshield/xcut/     ← utonguc/xcut          (xCut ürünü)
#    ~/xshield/mng/      ← utonguc/xshield-mng   (mng.xshield.com.tr)
#    ~/xshield/gox/      ← utonguc/xshield       (gox.xshield.com.tr, nested)
#    ~/xshield/pekiyi/   ← utonguc/pekiyi        (pekiyi.net + portal.pekiyi.net)
#    ~/xshield/infra/    ← utonguc/xshield-infra (bu dosya)
#
#  Yeni ürün eklemek için:
#    1. ~/xshield/<urun>/ dizinine repo'yu çek
#    2. Bu dosyaya servis ekle
#    3. nginx/prod.conf'a domain bloğu ekle
#    4. docker compose up -d --build <servis-adi>
#    5. docker compose up -d --force-recreate nginx
# ─────────────────────────────────────────────

services:

  # ── e-Clinic ──────────────────────────────
  eclinic_db:
    image: postgres:16
    container_name: eclinic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLINIC_DB_NAME:-clinicdb}
      POSTGRES_USER: ${CLINIC_DB_USER:-clinicuser}
      POSTGRES_PASSWORD: ${CLINIC_DB_PASS:-clinicpass}
    volumes:
      - eclinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLINIC_DB_USER:-clinicuser} -d ${CLINIC_DB_NAME:-clinicdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  eclinic_redis:
    image: redis:7
    container_name: eclinic_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  eclinic_backend:
    build:
      context: ../web/clinic/clinic-platform/backend
    container_name: eclinic_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=eclinic_db;Port=5432;Database=${CLINIC_DB_NAME:-clinicdb};Username=${CLINIC_DB_USER:-clinicuser};Password=${CLINIC_DB_PASS:-clinicpass}
      Jwt__Key: ${CLINIC_JWT_KEY}
      Jwt__Issuer: clinic-platform
      Jwt__Audience: clinic-platform-users
      Jwt__ExpireMinutes: 120
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseSsl: ${SMTP_SSL:-true}
      Smtp__UserName: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromAddress: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-xShield e-Clinic}
    depends_on:
      eclinic_db:
        condition: service_healthy
      eclinic_redis:
        condition: service_healthy
    volumes:
      - eclinic_uploads:/app/uploads

  eclinic_frontend:
    build:
      context: ../web/clinic/clinic-platform/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://eclinic.xshield.com.tr/api
        NEXT_PUBLIC_BUILD_VERSION: v1.1.0
    container_name: eclinic_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://eclinic.xshield.com.tr/api
      API_BASE_URL: http://eclinic_backend:8080/api
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - eclinic_backend

  # ── xShield Web ───────────────────────────
  xshield_web:
    build:
      context: ../web
    container_name: xshield_web
    restart: unless-stopped
    volumes:
      - /home/rootx/xshield/data:/app/data
    environment:
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-xShield}

  # ── Signed Landing ────────────────────────
  signed_landing:
    build:
      context: ../signed/landing
    container_name: signed_landing
    restart: unless-stopped
    environment:
      NODE_ENV: production

  # ── Signed DB ─────────────────────────────
  signed_db:
    image: postgres:15
    container_name: signed_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: signature
      POSTGRES_USER: signature_user
      POSTGRES_PASSWORD: ${SIGNED_DB_PASS:-signature_pass}
    volumes:
      - signed_pgdata:/var/lib/postgresql/data
      - ../signed/init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../signed/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signature_user -d signature"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Signed API ────────────────────────────
  signed_api:
    build:
      context: ../signed/signature-core
    container_name: signed_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://signature_user:${SIGNED_DB_PASS:-signature_pass}@signed_db:5432/signature
      SIGNATURE_API_KEY: ${SIGNED_API_KEY:-change-in-prod}
      JWT_SECRET: ${SIGNED_JWT_SECRET:-change-this-jwt-secret-in-production}
      ADMIN_EMAIL: ${SIGNED_ADMIN_EMAIL:-admin@xshield.com.tr}
      ADMIN_PASSWORD: ${SIGNED_ADMIN_PASS:-changeme}
      PUBLIC_URL: https://signed.xshield.com.tr
      PORTAL_TOKEN_HOURS: "48"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
    depends_on:
      signed_db:
        condition: service_healthy

  # ── Signed Panel ──────────────────────────
  signed_panel:
    build:
      context: ../signed/panel
    container_name: signed_panel
    restart: unless-stopped
    environment:
      API_URL: http://signed_api:5000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
    depends_on:
      - signed_api

  # ── xCut ──────────────────────────────────
  xcut_db:
    image: postgres:16
    container_name: xcut_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${XCUT_DB_NAME:-xcutdb}
      POSTGRES_USER: ${XCUT_DB_USER:-xcutuser}
      POSTGRES_PASSWORD: ${XCUT_DB_PASS:-xcutpass}
    volumes:
      - xcut_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${XCUT_DB_USER:-xcutuser} -d ${XCUT_DB_NAME:-xcutdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  xcut_backend:
    build:
      context: ../xcut/backend
    container_name: xcut_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=xcut_db;Port=5432;Database=${XCUT_DB_NAME:-xcutdb};Username=${XCUT_DB_USER:-xcutuser};Password=${XCUT_DB_PASS:-xcutpass}
      Jwt__Key: ${XCUT_JWT_KEY}
      Jwt__Issuer: xcut-platform
      Jwt__Audience: xcut-platform-users
      Jwt__ExpireMinutes: 120
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseSsl: ${SMTP_SSL:-true}
      Smtp__UserName: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromAddress: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-xCut}
      Fail2ban__BridgeUrl: http://host.docker.internal:7655
      Fail2ban__BridgeToken: ${FAIL2BAN_TOKEN:-xcut-f2b-bridge-2026}
      Facebook__AppId: "1627110575009127"
      Facebook__AppSecret: ${FB_APP_SECRET}
      Instagram__WebhookVerifyToken: ${INSTAGRAM_VERIFY_TOKEN:-xcut-ig-verify-2026}
      FrontendUrl: https://xcut.xshield.com.tr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      xcut_db:
        condition: service_healthy
    volumes:
      - xcut_uploads:/app/uploads

  xcut_frontend:
    build:
      context: ../xcut/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://xcut.xshield.com.tr/api
        NEXT_PUBLIC_BUILD_VERSION: v1.1.0
        NEXT_PUBLIC_FB_APP_ID: "1627110575009127"
        NEXT_PUBLIC_FB_CONFIG_ID: "958002593808849"
    container_name: xcut_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://xcut.xshield.com.tr/api
      API_BASE_URL: http://xcut_backend:8080/api
      INTERNAL_API_URL: http://xcut_backend:8080/api
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEXT_PUBLIC_FB_APP_ID: "1627110575009127"
      NEXT_PUBLIC_FB_CONFIG_ID: "958002593808849"
      FACEBOOK_APP_SECRET: ${FB_APP_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SSL:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: xCut
    depends_on:
      - xcut_backend

  # ── xShield MNG ───────────────────────────
  mng_db:
    image: postgres:16
    container_name: mng_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MNG_DB_NAME:-mngdb}
      POSTGRES_USER: ${MNG_DB_USER:-mnguser}
      POSTGRES_PASSWORD: ${MNG_DB_PASS:-mngpass}
    volumes:
      - mng_pgdata:/var/lib/postgresql/data
      - ../mng/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../mng/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MNG_DB_USER:-mnguser} -d ${MNG_DB_NAME:-mngdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  xshield_mng:
    build:
      context: ../mng
    container_name: xshield_mng
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${MNG_DB_USER:-mnguser}:${MNG_DB_PASS:-mngpass}@mng_db:5432/${MNG_DB_NAME:-mngdb}
      JWT_SECRET: ${MNG_JWT_SECRET}
      IMAP_HOST: ${MNG_IMAP_HOST:-srvc217.trwww.com}
      IMAP_PORT: ${MNG_IMAP_PORT:-993}
      IMAP_USER: ${MNG_IMAP_USER:-support@xshield.com.tr}
      IMAP_PASS: ${MNG_IMAP_PASS}
      IMAP_POLL_KEY: ${MNG_POLL_KEY}
      SMTP_HOST: ${MNG_IMAP_HOST:-srvc217.trwww.com}
      SMTP_PORT: 465
      SMTP_USER: ${MNG_IMAP_USER:-support@xshield.com.tr}
      SMTP_PASS: ${MNG_IMAP_PASS}
      PORTAL_SMTP_USER: ${MNG_NOREPLY_USER:-noreply@xshield.com.tr}
      PORTAL_SMTP_PASS: ${MNG_NOREPLY_PASS}
      UPTIME_CHECK_SECRET: ${UPTIME_CHECK_SECRET}
      VAULT_SECRET: ${MNG_VAULT_SECRET}
      EREM_BAYI: ${EREM_BAYI:-}
      EREM_USER: ${EREM_USER:-}
      EREM_PASS: ${EREM_PASS:-}
    ports:
      - "127.0.0.1:13000:3000"
    cap_add:
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - mng_uploads:/app/uploads
    depends_on:
      mng_db:
        condition: service_healthy

  # ── xSignage ──────────────────────────────
  signage_db:
    image: postgres:16
    container_name: signage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${SIGNAGE_DB_NAME:-signage}
      POSTGRES_USER:     ${SIGNAGE_DB_USER:-signage_user}
      POSTGRES_PASSWORD: ${SIGNAGE_DB_PASS:-signage_pass}
    volumes:
      - signage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIGNAGE_DB_USER:-signage_user} -d ${SIGNAGE_DB_NAME:-signage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  signage_api:
    build:
      context: ../signage/backend
    container_name: signage_api
    restart: unless-stopped
    environment:
      DATABASE_URL:   postgresql://${SIGNAGE_DB_USER:-signage_user}:${SIGNAGE_DB_PASS:-signage_pass}@signage_db:5432/${SIGNAGE_DB_NAME:-signage}
      JWT_SECRET:     ${SIGNAGE_JWT_SECRET:-change-in-production}
      ADMIN_EMAIL:    ${SIGNAGE_ADMIN_EMAIL:-admin@xshield.com.tr}
      ADMIN_PASSWORD: ${SIGNAGE_ADMIN_PASS:-changeme}
    depends_on:
      signage_db:
        condition: service_healthy
    volumes:
      - signage_uploads:/app/uploads

  signage_panel:
    build:
      context: ../signage/panel
    container_name: signage_panel
    restart: unless-stopped
    environment:
      API_URL: http://signage_api:8000
    depends_on:
      - signage_api

  # ── goX (gox.xshield.com.tr) ──────────────
  gox_db:
    image: postgres:16
    container_name: gox_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GOX_DB_NAME:-goxdb}
      POSTGRES_USER: ${GOX_DB_USER:-goxuser}
      POSTGRES_PASSWORD: ${GOX_DB_PASS:-goxpass}
    volumes:
      - gox_pgdata:/var/lib/postgresql/data
      - ../gox/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOX_DB_USER:-goxuser} -d ${GOX_DB_NAME:-goxdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gox_api:
    build:
      context: ../gox/api
      args:
        VERSION: v0.1.0
    container_name: gox_api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://${GOX_DB_USER:-goxuser}:${GOX_DB_PASS:-goxpass}@gox_db:5432/${GOX_DB_NAME:-goxdb}
      GOX_JWT_SECRET: ${GOX_JWT_SECRET}
      GOX_OWNER_EMAIL: ${GOX_OWNER_EMAIL:-}
      GOX_OWNER_PASSWORD: ${GOX_OWNER_PASSWORD:-}
      GOX_WG_ENDPOINT: ${GOX_WG_ENDPOINT:-77.223.130.51:443}
      GOX_RADIUS_SECRET: ${GOX_RADIUS_SECRET:-goxradius}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_USER: ${MNG_NOREPLY_USER:-noreply@xshield.com.tr}
      SMTP_PASS: ${MNG_NOREPLY_PASS}
      SMTP_FROM: ${MNG_NOREPLY_USER:-noreply@xshield.com.tr}
      GOX_MAIL_FROM_NAME: ${GOX_MAIL_FROM_NAME:-goX Misafir Wi-Fi}
      GOX_WA_NUMBER: ${GOX_WA_NUMBER:-}
      GOX_WA_VERIFY_TOKEN: ${GOX_WA_VERIFY_TOKEN:-}
      GOX_WA_TOKEN: ${GOX_WA_TOKEN:-}
      GOX_WA_PHONE_ID: ${GOX_WA_PHONE_ID:-}
    depends_on:
      gox_db:
        condition: service_healthy

  gox_panel:
    build:
      context: ../gox/panel
    container_name: gox_panel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORIGIN: https://gox.xshield.com.tr
      PORT: "3000"
      GOX_API_INTERNAL_URL: http://gox_api:8080
      GOX_JWT_SECRET: ${GOX_JWT_SECRET}
    depends_on:
      - gox_api

  gox_radius:
    build:
      context: ../gox/radius
    container_name: gox_radius
    restart: unless-stopped
    environment:
      GOX_DB_HOST: gox_db
      GOX_DB_PORT: "5432"
      GOX_DB_NAME: ${GOX_DB_NAME:-goxdb}
      GOX_DB_USER: ${GOX_DB_USER:-goxuser}
      GOX_DB_PASS: ${GOX_DB_PASS:-goxpass}
    depends_on:
      gox_db:
        condition: service_healthy

  gox_wg:
    build:
      context: ../gox/wg
    container_name: gox_wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      GOX_DB_HOST: gox_db
      GOX_DB_NAME: ${GOX_DB_NAME:-goxdb}
      GOX_DB_USER: ${GOX_DB_USER:-goxuser}
      GOX_DB_PASS: ${GOX_DB_PASS:-goxpass}
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "443:443/udp"
    volumes:
      - gox_wg_data:/etc/wireguard
    depends_on:
      - gox_radius
      - gox_db

  # ── Pekiyi (çok kiracılı okul yönetim SaaS'ı) ──
  pekiyi_db:
    image: postgres:16
    container_name: pekiyi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PEKIYI_DB_NAME:-pekiyidb}
      POSTGRES_USER: ${PEKIYI_DB_USER:-pekiyi}
      POSTGRES_PASSWORD: ${PEKIYI_DB_PASS:-pekiyi_pass}
    volumes:
      - pekiyi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PEKIYI_DB_USER:-pekiyi} -d ${PEKIYI_DB_NAME:-pekiyidb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pekiyi_backend:
    build:
      context: ../pekiyi/backend/Pekiyi.Api
    container_name: pekiyi_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=pekiyi_db;Port=5432;Database=${PEKIYI_DB_NAME:-pekiyidb};Username=${PEKIYI_DB_USER:-pekiyi};Password=${PEKIYI_DB_PASS:-pekiyi_pass}
      Jwt__Key: ${PEKIYI_JWT_KEY}
      Jwt__Issuer: pekiyi-platform
      Jwt__Audience: pekiyi-platform-users
      Jwt__ExpireMinutes: "120"
      Cors__AllowedOrigins__0: https://portal.pekiyi.net
    depends_on:
      pekiyi_db:
        condition: service_healthy

  pekiyi_frontend:
    build:
      context: ../pekiyi/frontend/pekiyi-web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://portal.pekiyi.net/api
    container_name: pekiyi_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://portal.pekiyi.net/api
    depends_on:
      - pekiyi_backend

  pekiyi_landing:
    build:
      context: ../pekiyi/landing
    container_name: pekiyi_landing
    restart: unless-stopped

  # ── nginx (ortak reverse proxy) ──────────
  nginx:
    image: nginx:stable
    container_name: xshield_nginx
    restart: unless-stopped
    depends_on:
      - eclinic_frontend
      - eclinic_backend
      - xshield_web
      - signed_landing
      - signed_panel
      - xcut_frontend
      - xcut_backend
      - signage_panel
      - signage_api
      - gox_api
      - gox_panel
      - pekiyi_frontend
      - pekiyi_backend
      - pekiyi_landing
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/xshield-nginx:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
      - "8088:8088"

volumes:
  eclinic_postgres_data:
    external: true
    name: clinic-platform_postgres_prod_data
  eclinic_uploads:
    external: true
    name: clinic-platform_uploads_data
  signed_pgdata:
  xcut_pgdata:
  xcut_uploads:
  signage_pgdata:
  mng_uploads:
  signage_uploads:
  mng_pgdata:
  gox_pgdata:
  gox_wg_data:
  pekiyi_pgdata:

networks:
  default:
    name: xshield-net
    external: true
