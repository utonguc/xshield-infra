    }

    location /api/ {
        set $up eclinic_backend:8080;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Uploaded files (doctor photos, documents, etc.)
    location /uploads/ {
        set $up eclinic_backend:8080;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        add_header         Cache-Control "public, max-age=86400" always;
    }

    # Static assets — hash-named, Cloudflare can cache these
    location /_next/static/ {
        set $up eclinic_frontend:3000;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # HTML pages — never cache so Cloudflare always fetches fresh
    location / {
        set $up eclinic_frontend:3000;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "private, no-cache, no-store, must-revalidate" always;
    }
}

