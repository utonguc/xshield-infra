# HTTP → HTTPS redirect (with agent EXE bypass)
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    # Agent EXE — plain HTTP, bypasses Cloudflare bot detection
    location /api/agent/exe {
        set $up xshield_mng:3000;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              mng.xshield.com.tr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# xShield ana web sitesi — xshield.com.tr
server {
    listen 443 ssl;
    server_name xshield.com.tr www.xshield.com.tr;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # _next/static: content-addressed, sonsuza kadar cache'lenebilir
    location /_next/static/ {
        set $up xshield_web:3001;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML sayfalar: asla cache'lenmemeli
    location / {
        set $up xshield_web:3001;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# Signed — signed.xshield.com.tr (landing + panel birleşik)
server {
    listen 443 ssl;
    server_name signed.xshield.com.tr;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;

    # Panel rotaları → signed_panel
    location ~ ^/(login|dashboard|portal|api|tenants|superadmin)(/|$) {
        set $up signed_panel:3000;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # _next static asset'leri: önce landing, bulamazsa panel'e düş
    location /_next/ {
        set $up signed_landing:3002;
        proxy_pass              http://$up;
        proxy_http_version      1.1;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors  on;
        error_page 404 = @panel_next;
    }
    location @panel_next {
        set $up signed_panel:3000;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Geri kalan her şey → landing
    location / {
        set $up signed_landing:3002;
        proxy_pass         http://$up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# appsigned.xshield.com.tr → signed.xshield.com.tr yönlendirmesi (eski bookmarklar için)
server {
    listen 443 ssl;
    server_name appsigned.xshield.com.tr;

